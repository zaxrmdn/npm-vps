version: '3.8'

networks:
  app-net:
    driver: bridge

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"     # Port HTTP publik untuk routing web & validasi Let's Encrypt
      - "81:81"     # Port Admin Web UI untuk manajemen GUI NPM
      - "443:443"   # Port HTTPS publik untuk akses aman ber-SSL
    environment:
      # Database bawaan SQLite (ringan dan tidak perlu setup database terpisah)
      DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - app-net
