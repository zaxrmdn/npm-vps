version: '3.8'

networks:
  app-net:
    driver: bridge

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"     # Port HTTP publik
      - "81:81"     # Port Web UI Admin NPM
      - "443:443"   # Port HTTPS publik
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - app-net
